# Tags every push to main with the version in js/core.js (const VERSION='x.y.z'), as a GitHub
# release v<VERSION>. If that version is already tagged, the push did not raise it, and nothing is
# made. Fails only if the version line is missing or malformed. GitHub Pages deploys from main on
# its own; this does not touch it.
name: Tag version
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read VERSION and tag the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n "s/^const VERSION='\([0-9]*\.[0-9]*\.[0-9]*\)';.*/\1/p" js/core.js)
          if [ -z "$v" ]; then echo "::error file=js/core.js::Found no const VERSION='x.y.z' in js/core.js"; exit 1; fi
          tag="v$v"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            if [ "$(git rev-list -n1 "$tag")" = "$GITHUB_SHA" ]; then echo "$tag is already on this commit"; exit 0; fi
            echo "::notice file=js/core.js::VERSION is still $v (tagged on $(git rev-list -n1 "$tag")), so no new release"
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes "$(git log -1 --format=%B "$GITHUB_SHA")"
